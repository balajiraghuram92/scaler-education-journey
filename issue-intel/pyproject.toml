[project]
name = "issue-intel"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.16.2",
  "sqlalchemy[asyncio]==2.1.8",
  "asyncpg==0.32.0",
  "alembic==1.20.1",
  "pgvector==0.5.0",
  "httpx==0.28.1",
  "mcp>=1.4,<2",  # capped at 1.x: server.py uses the MCP 1.x Server interface
  "aiosqlite==0.22.1",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1"]
lint = ["ruff==0.17.4", "mypy==2.4.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "evals*", "synthetic*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "synthetic", "evals", "alembic", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*", "synthetic.*", "evals.*", "alembic.*"]
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.alembic]
script_location = "alembic"
