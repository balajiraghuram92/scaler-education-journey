name: Build and Deploy to AWS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/balajiraghuram92/scaler-education-journey-api
  IMAGE_APP: ghcr.io/balajiraghuram92/scaler-education-journey-app
  AWS_REGION: ap-south-2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. Login to GitHub Container Registry
      # ---------------------------------------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ---------------------------------------------------------
      # 3. Configure AWS using GitHub OIDC
      # ---------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ---------------------------------------------------------
      # 4. Setup Docker Buildx
      #
      # Required for:
      # - linux/arm64 builds
      # - GitHub Actions cache
      # - BuildKit
      # ---------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ---------------------------------------------------------
      # 5. Build and push .NET API image
      #
      # Dockerfile:
      #   ./api/Dockerfile
      #
      # Build context:
      #   ./api
      #
      # Therefore:
      #   COPY ["StudyTracker.Api.csproj", "./"]
      #
      # correctly refers to:
      #   ./api/StudyTracker.Api.csproj
      # ---------------------------------------------------------
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          platforms: linux/arm64
          push: true

          tags: |
            ${{ env.IMAGE_API }}:${{ github.sha }}
            ${{ env.IMAGE_API }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ---------------------------------------------------------
      # 6. Build and push React image
      #
      # Dockerfile:
      #   ./app/Dockerfile
      #
      # Build context:
      #   ./app
      # ---------------------------------------------------------
      - name: Build and push React image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/arm64
          push: true

          tags: |
            ${{ env.IMAGE_APP }}:${{ github.sha }}
            ${{ env.IMAGE_APP }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ---------------------------------------------------------
      # 7. Deploy to EC2 using AWS SSM
      #
      # NO SSH
      # NO EC2_HOST
      # NO EC2_USERNAME
      # NO EC2_SSH_KEY
      # ---------------------------------------------------------
      - name: Deploy to EC2 using SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy StudyTracker application" \
            --parameters 'commands=[
              "set -e",
              "echo Starting deployment",

              "docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}",

              "docker pull ${{ env.IMAGE_API }}:latest",
              "docker pull ${{ env.IMAGE_APP }}:latest",

              "docker stop studytracker-api || true",
              "docker rm studytracker-api || true",

              "docker stop studytracker-app || true",
              "docker rm studytracker-app || true",

              "docker run -d --name studytracker-api --restart unless-stopped -p 8080:8080 ${{ env.IMAGE_API }}:latest",

              "docker run -d --name studytracker-app --restart unless-stopped -p 80:80 ${{ env.IMAGE_APP }}:latest",

              "docker image prune -af",

              "echo Deployment completed"
            ]' \
            --region "${{ env.AWS_REGION }}"
