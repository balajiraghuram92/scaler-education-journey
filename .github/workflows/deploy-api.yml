name: Build and Deploy to EC2 via SSM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}-api
  IMAGE_APP: ghcr.io/${{ github.repository }}-app
  AWS_REGION: ap-south-2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Calculate image tag
      # --------------------------------------------------
      - name: Calculate image tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          SHA_SHORT="$(git rev-parse --short=12 HEAD)"

          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # Login to GitHub Container Registry
      # --------------------------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # Enable ARM64 builds
      # --------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # --------------------------------------------------
      # Setup Docker Buildx
      # --------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------
      # Build and push backend image
      # --------------------------------------------------
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.IMAGE_API }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------
      # Build and push frontend image
      # --------------------------------------------------
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_APP }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.IMAGE_APP }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------
      # Authenticate to AWS using GitHub OIDC
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------
      # Verify AWS identity
      # --------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------
      # Deploy to EC2 using AWS Systems Manager
      # --------------------------------------------------
      - name: Deploy to EC2 via SSM
        run: |
          set -euo pipefail

          echo "Deploying to EC2 via AWS Systems Manager..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy StudyTracker application from GitHub Actions" \
            --parameters commands="[
              \"set -e\",
              \"cd /home/ec2-user/app\",
              \"export IMAGE_API=${{ env.IMAGE_API }}\",
              \"export IMAGE_APP=${{ env.IMAGE_APP }}\",
              \"export IMAGE_TAG=${{ steps.vars.outputs.sha_short }}\",
              \"echo '===> Pulling API image...'\",
              \"docker pull \\\${IMAGE_API}:\\\${IMAGE_TAG}\",
              \"echo '===> Pulling frontend image...'\",
              \"docker pull \\\${IMAGE_APP}:\\\${IMAGE_TAG}\",
              \"echo '===> Validating production Compose...'\",
              \"docker compose -f docker-compose.yml config >/tmp/scaler-compose-rendered.yml\",
              \"echo '===> Deploying production stack...'\",
              \"docker compose -f docker-compose.yml up -d --remove-orphans --no-build\",
              \"echo '===> Waiting for API...'\",
              \"for i in \\\$(seq 1 30); do if docker compose -f docker-compose.yml exec -T api curl -fsS http://localhost:5000/health >/dev/null; then echo 'API is healthy.'; break; fi; if [ \\\$i -eq 30 ]; then echo 'API failed health check.'; docker compose -f docker-compose.yml ps; docker compose -f docker-compose.yml logs --tail=200 api; exit 1; fi; sleep 2; done\",
              \"echo '===> Waiting for frontend...'\",
              \"for i in \\\$(seq 1 30); do if curl -fsS http://127.0.0.1/ >/dev/null; then echo 'Frontend is healthy.'; break; fi; if [ \\\$i -eq 30 ]; then echo 'Frontend failed health check.'; docker compose -f docker-compose.yml ps; docker compose -f docker-compose.yml logs --tail=200 app; exit 1; fi; sleep 2; done\",
              \"echo '===> Deployment successful.'\",
              \"docker compose -f docker-compose.yml ps\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for deployment command to finish..."

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text)

            echo "SSM status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed with status: $STATUS"

                echo "----- STDOUT -----"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                  --query "StandardOutputContent" \
                  --output text || true

                echo "----- STDERR -----"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                  --query "StandardErrorContent" \
                  --output text || true

                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for SSM command."
          exit 1
