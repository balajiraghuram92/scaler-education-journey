name: Build and Deploy to AWS EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/balajiraghuram92/scaler-education-journey-api
  IMAGE_APP: ghcr.io/balajiraghuram92/scaler-education-journey-app
  AWS_REGION: ap-south-2

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate image tag
        id: meta
        run: |
          echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_API }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE_APP }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_APP }}:latest

  deploy:
    name: Deploy to EC2 using SSM
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::781863099926:role/GitHubActionsStudyTrackerSSMRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Deploy to EC2 using SSM
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=InstanceIds,Values=${{ secrets.EC2_INSTANCE_ID }}" \
            --parameters 'commands=[
              "set -e",
              "cd /home/ubuntu/app",
              "export IMAGE_API=ghcr.io/balajiraghuram92/scaler-education-journey-api",
              "export IMAGE_APP=ghcr.io/balajiraghuram92/scaler-education-journey-app",
              "export IMAGE_TAG='"$IMAGE_TAG"'",
              "echo ===> Pulling API image...",
              "docker pull ${IMAGE_API}:${IMAGE_TAG}",
              "echo ===> Pulling frontend image...",
              "docker pull ${IMAGE_APP}:${IMAGE_TAG}",
              "echo ===> Validating production Compose...",
              "docker compose -f docker-compose.yml config >/tmp/scaler-compose-rendered.yml",
              "echo ===> Deploying production stack...",
              "docker compose -f docker-compose.yml up -d --remove-orphans --no-build",
              "echo ===> Waiting for API...",
              "for i in $(seq 1 30); do if docker compose -f docker-compose.yml exec -T api curl -fsS http://localhost:5000/health >/dev/null; then echo API is healthy.; break; fi; if [ \"$i\" -eq 30 ]; then echo API failed health check.; docker compose -f docker-compose.yml ps; docker compose -f docker-compose.yml logs --tail=200 api; exit 1; fi; sleep 2; done",
              "echo ===> Waiting for frontend...",
              "for i in $(seq 1 30); do if curl -fsS http://127.0.0.1/ >/dev/null; then echo Frontend is healthy.; break; fi; if [ \"$i\" -eq 30 ]; then echo Frontend failed health check.; docker compose -f docker-compose.yml ps; docker compose -f docker-compose.yml logs --tail=200 app; exit 1; fi; sleep 2; done",
              "echo ===> Deployment successful.",
              "docker compose -f docker-compose.yml ps"
            ]' \
            --comment "Deploy scaler education journey" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for deployment to complete..."

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed."
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                  --query "StandardErrorContent" \
                  --output text
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Deployment timed out waiting for SSM."
          exit 1
