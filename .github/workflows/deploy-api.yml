name: Build and Deploy Backend to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate image tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          SHA_SHORT="$(git rev-parse --short=12 HEAD)"

          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test EC2 port 22 from GitHub runner
        shell: bash
        run: |
          echo "Testing ${{ secrets.EC2_HOST }}:22"

          timeout 10 bash -c "</dev/tcp/${{ secrets.EC2_HOST }}/22" \
            && echo "EC2 port 22 is reachable from GitHub runner" \
            || {
              echo "EC2 port 22 is NOT reachable from GitHub runner"
              exit 1
            }
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true

          script: |
            set -euo pipefail

            APP_DIR="/home/${{ secrets.EC2_USERNAME }}/app"

            cd "$APP_DIR"

            export IMAGE_API="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
            export IMAGE_TAG="${{ steps.vars.outputs.sha_short }}"

            echo "===> Pulling API image..."
            docker pull "${IMAGE_API}:${IMAGE_TAG}"

            echo "===> Validating production Compose..."
            docker compose -f docker-compose.yml config >/tmp/scaler-compose-rendered.yml

            echo "===> Deploying production stack..."
            docker compose \
              -f docker-compose.yml \
              up -d \
              --remove-orphans \
              --no-build

            echo "===> Waiting for API..."

            for i in $(seq 1 30); do
              if docker compose -f docker-compose.yml exec -T api \
                curl -fsS http://localhost:5000/health >/dev/null; then
                echo "API is healthy."
                break
              fi

              if [ "$i" -eq 30 ]; then
                echo "API failed health check."
                docker compose -f docker-compose.yml ps
                docker compose -f docker-compose.yml logs --tail=200 api
                exit 1
              fi

              sleep 2
            done

            echo "===> Waiting for frontend..."

            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1/ >/dev/null; then
                echo "Frontend is healthy."
                break
              fi

              if [ "$i" -eq 30 ]; then
                echo "Frontend failed health check."
                docker compose -f docker-compose.yml ps
                docker compose -f docker-compose.yml logs --tail=200 app
                exit 1
              fi

              sleep 2
            done

            echo "===> Deployment successful."

            docker compose -f docker-compose.yml ps
