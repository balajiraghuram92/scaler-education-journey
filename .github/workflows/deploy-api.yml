name: Build and Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: neuralascent-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/balajiraghuram92/scaler-education-journey-api
  IMAGE_APP: ghcr.io/balajiraghuram92/scaler-education-journey-app
  IMAGE_RUNNER: ghcr.io/balajiraghuram92/neuralascent-java-runner
  IMAGE_PYTHON_RUNNER: ghcr.io/balajiraghuram92/neuralascent-python-runner
  IMAGE_AI_AGENT: ghcr.io/balajiraghuram92/scaler-education-journey-ai-agent
  AWS_REGION: ap-south-2
  DOMAIN_NAME: neuralascent.top
  LETSENCRYPT_EMAIL: admin@neuralascent.top
  STUDYTRACKER_ENV_PARAMETER: /neuralascent/prod/api-env
  STUDYTRACKER_REGISTRY_TOKEN_PARAMETER: /neuralascent/prod/ghcr-read-token
  BACKUP_S3_URI: s3://scaler-studytracker-backups-781863099926-ap-south-2-an/database-backups

jobs:
  build-and-deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify API
        run: dotnet test tests/StudyTracker.Api.Tests/StudyTracker.Api.Tests.csproj --configuration Release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Verify frontend
        working-directory: app
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        id: build_api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ github.sha }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push frontend image
        id: build_app
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_APP }}:${{ github.sha }}
            ${{ env.IMAGE_APP }}:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Build and push AI agent image
        id: build_ai_agent
        uses: docker/build-push-action@v6
        with:
          context: ./ai-agent
          file: ./ai-agent/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_AI_AGENT }}:${{ github.sha }}
            ${{ env.IMAGE_AI_AGENT }}:latest
          cache-from: type=gha,scope=ai-agent
          cache-to: type=gha,scope=ai-agent,mode=max

      - name: Build and push Java runner image
        id: build_runner
        uses: docker/build-push-action@v6
        with:
          context: ./runner/java
          file: ./runner/java/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_RUNNER }}:${{ github.sha }}
            ${{ env.IMAGE_RUNNER }}:latest
          cache-from: type=gha,scope=java-runner
          cache-to: type=gha,scope=java-runner,mode=max

      - name: Build and push Python runner image
        id: build_python_runner
        uses: docker/build-push-action@v6
        with:
          context: ./runner/python
          file: ./runner/python/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PYTHON_RUNNER }}:${{ github.sha }}
            ${{ env.IMAGE_PYTHON_RUNNER }}:latest
          cache-from: type=gha,scope=python-runner
          cache-to: type=gha,scope=python-runner,mode=max

      - name: Verify published platforms
        shell: bash
        run: |
          set -euo pipefail
          for image in "${IMAGE_API}:${GITHUB_SHA}" "${IMAGE_APP}:${GITHUB_SHA}" "${IMAGE_RUNNER}:${GITHUB_SHA}" "${IMAGE_PYTHON_RUNNER}:${GITHUB_SHA}" "${IMAGE_AI_AGENT}:${GITHUB_SHA}"; do
            manifest=$(docker buildx imagetools inspect "${image}")
            grep -q 'linux/arm64' <<<"${manifest}"
          done

      - name: Deploy immutable release to EC2
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Neuralascent ${GITHUB_SHA}" \
            --parameters 'commands=[
              "set -eu",
              "SCRIPT_BASE=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}",
              "curl -fsSL -H \"Authorization: token ${{ secrets.GITHUB_TOKEN }}\" $SCRIPT_BASE/scripts/bootstrap-single-ec2.sh -o /tmp/bootstrap-single-ec2.sh",
              "curl -fsSL -H \"Authorization: token ${{ secrets.GITHUB_TOKEN }}\" $SCRIPT_BASE/scripts/deploy-single-ec2.sh -o /tmp/deploy-single-ec2.sh",
              "chmod 700 /tmp/bootstrap-single-ec2.sh /tmp/deploy-single-ec2.sh",
              "STUDYTRACKER_ENV_PARAMETER=${{ env.STUDYTRACKER_ENV_PARAMETER }} STUDYTRACKER_REGISTRY_TOKEN_PARAMETER=${{ env.STUDYTRACKER_REGISTRY_TOKEN_PARAMETER }} /tmp/bootstrap-single-ec2.sh",
              "API_IMAGE=${{ env.IMAGE_API }} APP_IMAGE=${{ env.IMAGE_APP }} RUNNER_IMAGE=${{ env.IMAGE_RUNNER }} API_REF=${{ env.IMAGE_API }}@${{ steps.build_api.outputs.digest }} APP_REF=${{ env.IMAGE_APP }}@${{ steps.build_app.outputs.digest }} RUNNER_REF=${{ env.IMAGE_RUNNER }}@${{ steps.build_runner.outputs.digest }} PYTHON_RUNNER_IMAGE=${{ env.IMAGE_PYTHON_RUNNER }} PYTHON_RUNNER_REF=${{ env.IMAGE_PYTHON_RUNNER }}@${{ steps.build_python_runner.outputs.digest }} AI_AGENT_IMAGE=${{ env.IMAGE_AI_AGENT }} AI_AGENT_REF=${{ env.IMAGE_AI_AGENT }}@${{ steps.build_ai_agent.outputs.digest }} IMAGE_TAG=${{ github.sha }} DOMAIN_NAME=${{ env.DOMAIN_NAME }} LETSENCRYPT_EMAIL=${{ env.LETSENCRYPT_EMAIL }} BACKUP_S3_URI=${{ env.BACKUP_S3_URI }} RESTORE_LATEST_BACKUP=true ALLOW_CREATE_DATABASE=false /tmp/deploy-single-ec2.sh"
            ]' \
            --output-s3-bucket-name scaler-studytracker-backups-781863099926-ap-south-2-an \
            --output-s3-key-prefix deploy-logs/${GITHUB_SHA} \
            --region "${AWS_REGION}" \
            --query 'Command.CommandId' \
            --output text)

          echo "Waiting for SSM deployment command ${COMMAND_ID}"
          STATUS=Pending
          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${AWS_REGION}" \
              --query 'Status' \
              --output text 2>/dev/null || echo Pending)

            case "${STATUS}" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac

            sleep 10
          done

          case "${STATUS}" in
            Success|Failed|Cancelled|TimedOut|Cancelling) ;;
            *)
              aws ssm cancel-command \
                --command-id "${COMMAND_ID}" \
                --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
                --region "${AWS_REGION}" || true
              STATUS=TimedOut
              ;;
          esac

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${AWS_REGION}" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'

          test "${STATUS}" = "Success"

      - name: Show full deploy log location on failure
        if: failure()
        run: |
          echo "Full untruncated deploy output (stdout/stderr) is at:"
          echo "s3://scaler-studytracker-backups-781863099926-ap-south-2-an/deploy-logs/${GITHUB_SHA}/"