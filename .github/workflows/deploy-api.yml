name: Build and Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/balajiraghuram92/scaler-education-journey-api
  IMAGE_APP: ghcr.io/balajiraghuram92/scaler-education-journey-app
  AWS_REGION: ap-south-2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Login to GitHub Container Registry
      # ---------------------------------------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # 3. Configure AWS using GitHub OIDC
      # ---------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ---------------------------------------------------------
      # 4. Set up QEMU (Required for ARM64 cross-building on x86 runner)
      # ---------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # ---------------------------------------------------------
      # 5. Setup Docker Buildx
      # ---------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------------
      # 6. Build and push .NET API image (ARM64)
      # ---------------------------------------------------------
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ github.sha }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------
      # 7. Build and push React Frontend image (ARM64)
      # ---------------------------------------------------------
      - name: Build and push React image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_APP }}:${{ github.sha }}
            ${{ env.IMAGE_APP }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------
      # 8. Deploy to EC2 using AWS SSM
      # ---------------------------------------------------------
      - name: Deploy to EC2 using SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy StudyTracker application" \
            --parameters 'commands=[
              "set -e",
              "echo Starting deployment",

              "docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}",

              "docker pull ${{ env.IMAGE_API }}:latest",
              "docker pull ${{ env.IMAGE_APP }}:latest",

              "docker network create scaler-network || true",
              "docker network connect scaler-network studytracker-postgres || true",

              "docker stop studytracker-api || true",
              "docker rm studytracker-api || true",

              "docker stop studytracker-app || true",
              "docker rm studytracker-app || true",

              "docker run -d --name studytracker-api --network scaler-network --restart unless-stopped -p 5000:8080 --add-host host.docker.internal:host-gateway --env-file /etc/studytracker/api.env ${{ env.IMAGE_API }}:latest",

              "docker run -d --name studytracker-app --network scaler-network --restart unless-stopped -p 80:80 ${{ env.IMAGE_APP }}:latest",

              "docker image prune -af",

              "echo Deployment completed"
            ]' \
            --region "${{ env.AWS_REGION }}"
