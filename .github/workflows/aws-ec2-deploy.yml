name: AWS EC2 Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY_API: ${{ secrets.ECR_REPOSITORY_API || 'scaler-journey-api' }}
  ECR_REPOSITORY_APP: ${{ secrets.ECR_REPOSITORY_APP || 'scaler-journey-app' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Git SHA Short Tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials (OIDC or Static Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsEC2Deploy

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push API Image to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:${{ steps.vars.outputs.sha_short }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_APP }}:${{ steps.vars.outputs.sha_short }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_APP }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to AWS EC2 via SSH
        if: ${{ secrets.EC2_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -euo pipefail
            echo "===> Authenticating with Amazon ECR..."
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            
            echo "===> Pulling immutable image tag ${{ steps.vars.outputs.sha_short }}..."
            docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:${{ steps.vars.outputs.sha_short }}
            docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_APP }}:${{ steps.vars.outputs.sha_short }}
            
            echo "===> Deploying stack via Docker Compose..."
            cd /home/${{ secrets.EC2_USERNAME || 'ubuntu' }}/app || cd /app || cd ~/
            
            export ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
            export ECR_REPOSITORY_API="${{ env.ECR_REPOSITORY_API }}"
            export ECR_REPOSITORY_APP="${{ env.ECR_REPOSITORY_APP }}"
            export IMAGE_TAG="${{ steps.vars.outputs.sha_short }}"
            
            docker compose up -d --remove-orphans
            
            echo "===> Verifying container health..."
            sleep 5
            docker compose ps
            docker compose exec -T api curl -f http://localhost:5000/health
            curl -f http://localhost/

      - name: Deploy to AWS EC2 via SSM Command
        if: ${{ secrets.EC2_INSTANCE_ID != '' && secrets.EC2_HOST == '' }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -euo pipefail",
              "aws ecr get-login-password --region '${{ env.AWS_REGION }}' | docker login --username AWS --password-stdin '${{ steps.login-ecr.outputs.registry }}'",
              "docker pull '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:${{ steps.vars.outputs.sha_short }}'",
              "docker pull '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_APP }}:${{ steps.vars.outputs.sha_short }}'",
              "cd /app || cd /home/ubuntu/app",
              "export ECR_REGISTRY='${{ steps.login-ecr.outputs.registry }}'",
              "export ECR_REPOSITORY_API='${{ env.ECR_REPOSITORY_API }}'",
              "export ECR_REPOSITORY_APP='${{ env.ECR_REPOSITORY_APP }}'",
              "export IMAGE_TAG='${{ steps.vars.outputs.sha_short }}'",
              "docker compose up -d --remove-orphans",
              "docker compose ps",
              "docker compose exec -T api curl -f http://localhost:5000/health",
              "curl -f http://localhost/"
            ]' \
            --query "Command.CommandId" \
            --output text)
          
          echo "SSM Command sent successfully with ID: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}"
