name: Build and Deploy to EC2 via GHCR

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}-api
  IMAGE_APP: ghcr.io/${{ github.repository }}-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculate image tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          SHA_SHORT="$(git rev-parse --short=12 HEAD)"

          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_APP }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.IMAGE_APP }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true

          script: |
            set -euo pipefail

            APP_DIR="/home/${{ secrets.EC2_USERNAME }}/app"

            cd "$APP_DIR"

            export IMAGE_API="${{ env.IMAGE_API }}"
            export IMAGE_APP="${{ env.IMAGE_APP }}"
            export IMAGE_TAG="${{ steps.vars.outputs.sha_short }}"

            echo "===> Pulling API image..."
            docker pull "${IMAGE_API}:${IMAGE_TAG}"

            echo "===> Pulling frontend image..."
            docker pull "${IMAGE_APP}:${IMAGE_TAG}"

            echo "===> Validating production Compose..."
            docker compose -f docker-compose.yml config >/tmp/scaler-compose-rendered.yml

            echo "===> Deploying production stack..."
            docker compose \
              -f docker-compose.yml \
              up -d \
              --remove-orphans \
              --no-build

            echo "===> Waiting for API..."

            for i in $(seq 1 30); do
              if docker compose -f docker-compose.yml exec -T api \
                curl -fsS http://localhost:5000/health >/dev/null; then
                echo "API is healthy."
                break
              fi

              if [ "$i" -eq 30 ]; then
                echo "API failed health check."
                docker compose -f docker-compose.yml ps
                docker compose -f docker-compose.yml logs --tail=200 api
                exit 1
              fi

              sleep 2
            done

            echo "===> Waiting for frontend..."

            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1/ >/dev/null; then
                echo "Frontend is healthy."
                break
              fi

              if [ "$i" -eq 30 ]; then
                echo "Frontend failed health check."
                docker compose -f docker-compose.yml ps
                docker compose -f docker-compose.yml logs --tail=200 app
                exit 1
              fi

              sleep 2
            done

            echo "===> Deployment successful."

            docker compose -f docker-compose.yml ps
