[project]
name = "studytracker-api-python"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
# Seed-data literals run to ~800 chars a line
# (app/seed/localization_seed_translations.py); files are not reformatted this
# round, so the limit covers the longest line with margin.
line-length = 1000
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008 flags FastAPI's Depends(...) defaults, which are the framework's own idiom.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["docker: requires a Docker daemon and runner images (skipped by default)"]
