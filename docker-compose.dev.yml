services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: scaler-journey-api:dev

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    image: scaler-journey-app:dev
    environment:
      DOMAIN_NAME: localhost
      API_KEY: ${API_KEY}

    depends_on:
      api:
        condition: service_healthy

  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    image: scaler-journey-ai-agent:dev
    ports:
      - "127.0.0.1:8000:8000"   
